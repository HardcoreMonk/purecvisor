<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="pcv-network-title pcv-network-desc">
  <title id="pcv-network-title">PureCVisor Single Edge 네트워크 서비스 구성도</title>
  <desc id="pcv-network-desc">Web UI, pcvctl, REST와 RPC 요청이 purecvisorsd의 네트워크 제어면으로 들어와 기본 연결, 가상 네트워크, 정책, 가속과 관측 서비스로 나뉘고 Linux bridge, dnsmasq, nftables, TC, OVS, OVN, WireGuard, VFIO, IOMMU와 libvirt VM NIC에 적용되는 구조다. 패킷은 데몬을 경유하지 않고 선택한 Linux KVM 데이터 경로로 흐른다.</desc>
  <defs>
    <marker id="pcv-network-arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#12627a"/>
    </marker>
    <marker id="pcv-network-arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#3f4958"/>
    </marker>
    <marker id="pcv-network-arrow-fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9a5b13"/>
    </marker>
    <style>
      .canvas{fill:#f8fafc}.boundary{fill:#fff;stroke:#7f8b99;stroke-width:2}.client{fill:#e7f3ff;stroke:#3a78b8;stroke-width:2}.runtime{fill:#e6f7ed;stroke:#27845d;stroke-width:2}.family{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.fast{fill:#fff4e8;stroke:#b87543;stroke-width:1.5}.outcome{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.candidate-box{fill:#f7f9fb;stroke:#667085;stroke-width:1.5;stroke-dasharray:4 5}.title{font:700 30px system-ui,sans-serif;fill:#171c24}.subtitle{font:500 15px system-ui,sans-serif;fill:#5c6675}.eyebrow{font:700 13px system-ui,sans-serif;letter-spacing:1.35px;fill:#12627a}.boundary-title{font:700 16px system-ui,sans-serif;fill:#171c24}.node-title{font:700 17px system-ui,sans-serif;fill:#171c24}.node-copy{font:500 14px system-ui,sans-serif;fill:#5c6675}.node-copy-strong{font:650 14px system-ui,sans-serif;fill:#3f4958}.node-mono{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#171c24}.small{font:600 12px system-ui,sans-serif;fill:#5c6675}.flow-label{font:700 13px system-ui,sans-serif;fill:#12627a}.data-label{font:700 13px system-ui,sans-serif;fill:#3f4958}.fast-label{font:700 13px system-ui,sans-serif;fill:#9a5b13}.control{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#pcv-network-arrow-control)}.control-line{fill:none;stroke:#12627a;stroke-width:2.2}.data{fill:none;stroke:#3f4958;stroke-width:2.2;marker-end:url(#pcv-network-arrow-data)}.data-line{fill:none;stroke:#3f4958;stroke-width:2}.accelerated{fill:none;stroke:#9a5b13;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#pcv-network-arrow-fast)}.candidate{fill:none;stroke:#667085;stroke-width:2;stroke-dasharray:3 6}.divider{stroke:#dce1e8;stroke-width:1}.pill{fill:#e6f0f3;stroke:#12627a;stroke-width:1}.pill-warm{fill:#fff0df;stroke:#b87543;stroke-width:1}text{pointer-events:none}
    </style>
  </defs>
  <rect class="canvas" width="1440" height="1080"/>
  <text class="eyebrow" x="40" y="42">SINGLE EDGE · NETWORK SERVICES</text>
  <text class="title" x="40" y="80">요청에서 Linux/KVM 패킷 경로까지 한 번에 읽기</text>
  <text class="subtitle" x="40" y="108">제어 요청은 purecvisorsd가 적용하고, 실제 패킷은 선택한 host 데이터 경로로 직접 흐릅니다.</text>

  <line class="control" x1="42" y1="137" x2="104" y2="137"/>
  <text class="flow-label" x="116" y="141">구성 · 조회 · 복구</text>
  <line class="data" x1="300" y1="137" x2="362" y2="137"/>
  <text class="data-label" x="374" y="141">VM 데이터 경로</text>
  <line class="accelerated" x1="548" y1="137" x2="610" y2="137"/>
  <text class="fast-label" x="622" y="141">가속 우회 경로</text>
  <line class="candidate" x1="812" y1="137" x2="874" y2="137"/>
  <text class="data-label" x="886" y="141">후보 backend</text>
  <rect class="pill" x="1122" y="123" width="278" height="28" rx="5"/>
  <text class="small" x="1261" y="142" text-anchor="middle">공개 범위 · 한 Linux/KVM 호스트</text>

  <rect class="boundary" x="40" y="170" width="1360" height="178" rx="12"/>
  <text class="eyebrow" x="66" y="201">PURECVISORSD · SINGLE PROCESS · GMAINLOOP CONTROL PLANE</text>
  <g data-pcv-node-id="networkEntry">
  <rect class="client" x="68" y="224" width="216" height="92" rx="8"/>
  <text class="node-title" x="176" y="257" text-anchor="middle">사용자 진입점</text>
  <text class="node-copy" x="176" y="283" text-anchor="middle">Web UI · pcvctl</text>
  <text class="node-copy" x="176" y="304" text-anchor="middle">REST · UDS RPC</text>
  </g>
  <g data-pcv-node-id="networkAuth">
  <rect class="runtime" x="340" y="224" width="246" height="92" rx="8"/>
  <text class="node-title" x="463" y="257" text-anchor="middle">인증 · dispatcher</text>
  <text class="node-copy" x="463" y="283" text-anchor="middle">RBAC · tenant scope</text>
  <text class="node-copy" x="463" y="304" text-anchor="middle">입력 검증 · audit 경계</text>
  </g>
  <g data-pcv-node-id="networkHandlers">
  <rect class="runtime" x="642" y="224" width="330" height="92" rx="8"/>
  <text class="node-title" x="807" y="257" text-anchor="middle">Network handlers</text>
  <text class="node-copy" x="807" y="283" text-anchor="middle">짧은 조회·변경은 event loop에서 완료</text>
  <text class="node-copy" x="807" y="304" text-anchor="middle">긴 작업은 accepted 후 제한된 GTask</text>
  </g>
  <g data-pcv-node-id="networkDesired">
  <rect class="runtime" x="1028" y="224" width="344" height="92" rx="8"/>
  <text class="node-title" x="1200" y="257" text-anchor="middle">Desired state · reconcile</text>
  <text class="node-copy" x="1200" y="283" text-anchor="middle">생성 · 조회 · 재수화 · 정리</text>
  <text class="node-copy" x="1200" y="304" text-anchor="middle">actual 확인 · 결과 audit · 완료 통지</text>
  </g>
