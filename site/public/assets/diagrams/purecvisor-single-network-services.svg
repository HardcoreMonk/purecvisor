  <path class="control pcv-network-edge" data-pcv-edge-id="network-auth-handlers" data-pcv-from="networkAuth" data-pcv-to="networkHandlers" d="M586 270H642"/>
  <path class="control pcv-network-edge" data-pcv-edge-id="network-handlers-desired" data-pcv-from="networkHandlers" data-pcv-to="networkDesired" d="M972 270H1028"/>

  <path class="control-line" d="M1200 316V366H225"/>
  <path class="control-line" d="M1200 366H1213"/>
  <path class="control pcv-network-edge" data-pcv-edge-id="network-desired-basic" data-pcv-from="networkDesired" data-pcv-to="networkBasic" d="M225 366V396"/>
  <path class="control pcv-network-edge" data-pcv-edge-id="network-desired-virtual" data-pcv-from="networkDesired" data-pcv-to="networkVirtual" d="M554 366V396"/>
  <path class="control pcv-network-edge" data-pcv-edge-id="network-desired-policy" data-pcv-from="networkDesired" data-pcv-to="networkPolicy" d="M883 366V396"/>
  <path class="control pcv-network-edge" data-pcv-edge-id="network-desired-accel" data-pcv-from="networkDesired" data-pcv-to="networkAccel" d="M1213 366V396"/>

  <rect class="boundary" x="40" y="396" width="1360" height="316" rx="12"/>
  <text class="eyebrow" x="66" y="427">NETWORK SERVICE FAMILIES · 네트워크와 보안 운영 예제로 연결</text>

  <g data-pcv-node-id="networkBasic">
  <rect class="family" x="68" y="452" width="315" height="228" rx="8"/>
  <text class="node-title" x="90" y="484">기본 연결</text>
  <text class="node-copy-strong" x="90" y="516">NAT · isolated · routed</text>
  <text class="node-copy" x="90" y="540">사설 주소, 내부 격리, upstream 정적 route</text>
  <line class="divider" x1="90" y1="556" x2="361" y2="556"/>
  <text class="node-copy-strong" x="90" y="586">bridge/dedicated · bridge/shared</text>
  <text class="node-copy" x="90" y="610">전용 또는 host L3 보존 물리 LAN</text>
  <line class="divider" x1="90" y1="626" x2="361" y2="626"/>
  <text class="node-copy-strong" x="90" y="655">VM VLAN tag</text>
  <text class="small" x="90" y="675">libvirt persistent XML의 vlan_id</text>
  </g>

  <g data-pcv-node-id="networkVirtual">
  <rect class="family" x="397" y="452" width="315" height="228" rx="8"/>
  <text class="node-title" x="419" y="484">가상 네트워크</text>
  <text class="node-copy-strong" x="419" y="516">OVS VXLAN · 수동 peer</text>
  <text class="node-copy" x="419" y="540">명시한 VNI와 tunnel source</text>
  <line class="divider" x1="419" y1="556" x2="690" y2="556"/>
  <text class="node-copy-strong" x="419" y="586">tenant overlay · generic OVN</text>
  <text class="node-copy" x="419" y="610">WireGuard 격리 · LS/LR/DHCP/ACL/NAT</text>
  <line class="divider" x1="419" y1="626" x2="690" y2="626"/>
  <text class="node-copy-strong" x="419" y="655">Local VPC · Linux 지원</text>
  <text class="small" x="419" y="675">subnet · attachment · Service Publish</text>
  </g>

  <g data-pcv-node-id="networkPolicy">
  <rect class="family" x="726" y="452" width="315" height="228" rx="8"/>
  <text class="node-title" x="748" y="484">정책 · 보호</text>
  <text class="node-copy-strong" x="748" y="516">관리형 nftables</text>
  <text class="node-copy" x="748" y="540">NAT · 격리 · routed 경계</text>
  <line class="divider" x1="748" y1="556" x2="1019" y2="556"/>
  <text class="node-copy-strong" x="748" y="586">Security Group · QoS</text>
  <text class="node-copy" x="748" y="610">VM 접근 정책 · VM/tenant SLA</text>
  <line class="divider" x1="748" y1="626" x2="1019" y2="626"/>
  <text class="node-copy-strong" x="748" y="655">Suricata IDS · IPS</text>
  <text class="small" x="748" y="675">EVE 탐지 · 선택형 NFQUEUE 인라인</text>
  </g>

  <g data-pcv-node-id="networkAccel">
  <rect class="family" x="1055" y="452" width="317" height="228" rx="8"/>
  <text class="node-title" x="1077" y="484">가속 · 관측</text>
  <rect class="pill-warm" x="1077" y="504" width="273" height="54" rx="6"/>
  <text class="node-copy-strong" x="1093" y="527">DPDK · SR-IOV</text>
  <text class="small" x="1093" y="548">vfio-pci · OVS-DPDK · PF/VF 직접 할당</text>
  <line class="divider" x1="1077" y1="578" x2="1350" y2="578"/>
  <text class="node-copy-strong" x="1077" y="608">host baseline · 디버깅</text>
  <text class="node-copy" x="1077" y="632">interface · route · bridge · OVS actual</text>
  <line class="divider" x1="1077" y1="648" x2="1350" y2="648"/>
  <text class="node-copy-strong" x="1077" y="674">Prometheus 네트워크 메트릭</text>
  </g>

  <path class="data pcv-network-edge" data-pcv-edge-id="network-basic-linux" data-pcv-from="networkBasic" data-pcv-to="actualLinux" d="M225 680V752"/>
