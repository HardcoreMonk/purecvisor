  <g data-pcv-node-id="actualLinux">
  <rect class="actual" x="68" y="806" width="246" height="92" rx="8"/>
  <text class="node-mono" x="191" y="839" text-anchor="middle">Linux bridge · dnsmasq</text>
  <text class="node-copy" x="191" y="865" text-anchor="middle">NAT · isolated · routed</text>
  <text class="node-copy" x="191" y="886" text-anchor="middle">dedicated/shared portal</text>
  </g>
  <g data-pcv-node-id="actualPolicy">
  <rect class="actual" x="338" y="806" width="246" height="92" rx="8"/>
  <text class="node-mono" x="461" y="839" text-anchor="middle">nftables · TC · NFQUEUE</text>
  <text class="node-copy" x="461" y="865" text-anchor="middle">firewall · SG · QoS</text>
  <text class="node-copy" x="461" y="886" text-anchor="middle">Suricata inline</text>
  </g>
  <g data-pcv-node-id="actualVirtual">
  <rect class="actual" x="608" y="806" width="246" height="92" rx="8"/>
  <text class="node-mono" x="731" y="839" text-anchor="middle">OVS · OVN · WireGuard</text>
  <text class="node-copy" x="731" y="865" text-anchor="middle">VXLAN · logical network</text>
  <text class="node-copy" x="731" y="886" text-anchor="middle">tenant encrypted overlay</text>
  </g>
  <g data-pcv-node-id="actualFast">
  <rect class="fast" x="878" y="806" width="246" height="92" rx="8"/>
  <text class="node-mono" x="1001" y="839" text-anchor="middle">VFIO · IOMMU · PF/VF</text>
  <text class="node-copy" x="1001" y="865" text-anchor="middle">DPDK vhost-user</text>
  <text class="node-copy" x="1001" y="886" text-anchor="middle">SR-IOV hostdev</text>
  </g>
  <g data-pcv-node-id="actualVmNic">
  <rect class="actual" x="1148" y="806" width="224" height="92" rx="8"/>
  <text class="node-mono" x="1260" y="839" text-anchor="middle">libvirt · VM NIC</text>
  <text class="node-copy" x="1260" y="865" text-anchor="middle">persistent XML · VLAN</text>
  <text class="node-copy" x="1260" y="886" text-anchor="middle">attach · start</text>
  </g>

