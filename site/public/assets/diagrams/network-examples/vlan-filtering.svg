<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="vlan-title vlan-desc">
  <title id="vlan-title">VLAN 필터링 활용 예제 구성도</title>
  <desc id="vlan-desc">VLAN 100 지정이 PureCVisor와 libvirt persistent XML을 거쳐 VM NIC의 태그와 물리 trunk에 반영되고 upstream VLAN 통신을 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.3 · VLAN FILTERING</text><text class="t" x="35" y="59">VM을 upstream VLAN 100에 연결</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">INPUT</text><text class="t" x="53" y="147">vlan_id = 100</text><text class="c" x="53" y="174">VM · bridge 선택</text><text class="c" x="53" y="196">upstream trunk 확인</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">PURECVISOR</text><text class="t" x="293" y="147">NIC 설정 검증</text><text class="c" x="293" y="174">허용 범위 확인</text><text class="c" x="293" y="196">persistent 반영</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">DATA PATH</text><text class="t" x="533" y="147">libvirt XML</text><text class="c" x="533" y="174">VM NIC VLAN tag</text><text class="c" x="533" y="196">bridge → trunk</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">VERIFY</text><text class="t" x="773" y="147">VLAN 100</text><text class="c" x="773" y="174">dumpxml · bridge</text><text class="c" x="773" y="196">upstream reachability</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">VLAN 태그는 VM NIC의 persistent 정의와 upstream switch의 trunk 허용 목록이 함께 맞아야 합니다.</text>
</svg>
