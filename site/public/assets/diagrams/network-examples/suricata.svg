<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="suricata-title suricata-desc">
  <title id="suricata-title">Suricata IDS IPS 활용 예제 구성도</title>
  <desc id="suricata-desc">host forward 패킷이 nftables NFQUEUE를 거쳐 Suricata IDS 또는 IPS 엔진에서 검사되고 선택한 SID 정책에 따라 허용 또는 drop되며 보안 이벤트로 기록되는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">10.12 · SURICATA IDS / IPS</text><text class="t" x="35" y="59">검토한 SID만 인라인 차단 정책에 추가</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">FORWARD PACKET</text><text class="t" x="53" y="147">VM network</text><text class="c" x="53" y="174">기존 filter 경로</text><text class="c" x="53" y="196">검사 대상 traffic</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">NFQUEUE</text><text class="t" x="293" y="147">inet purecvisor ips</text><text class="c" x="293" y="174">fail-open 설정</text><text class="c" x="293" y="196">queue readiness</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">SURICATA</text><text class="t" x="533" y="147">IDS · IPS engine</text><text class="c" x="533" y="174">파생 drop rules</text><text class="c" x="533" y="196">EVE alert</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">OUTCOME</text><text class="t" x="773" y="147">allow · drop</text><text class="c" x="773" y="174">status · drop.list</text><text class="c" x="773" y="196">security event</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">활성화 응답이 아니라 queue readiness, 파생 룰셋과 status 수렴을 확인한 뒤 성공으로 판정합니다.</text>
</svg>
