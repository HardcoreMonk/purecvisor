<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="vpc-title vpc-desc">
  <title id="vpc-title">Local VPC 활용 예제 구성도</title>
  <desc id="vpc-desc">허용된 source CIDR의 client가 Single Edge host의 8443 포트에 접속하면 PureCVisor Service Publish와 nftables 경계를 거쳐 Local VPC attachment의 web-prod VM 443 포트로 전달되는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.13 · LOCAL VPC</text><text class="t" x="35" y="59">Linux Local VPC의 VM 서비스를 제한 게시</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">ALLOWED CLIENT</text><text class="t" x="53" y="147">source CIDR</text><text class="c" x="53" y="174">실제 client 대역</text><text class="c" x="53" y="196">TCP request</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">HOST LISTENER</text><text class="t" x="293" y="147">node IPv4 :8443</text><text class="c" x="293" y="174">Service Publish</text><text class="c" x="293" y="196">nft source 경계</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">VPC ATTACHMENT</text><text class="t" x="533" y="147">prod / web subnet</text><text class="c" x="533" y="174">Linux bridge · NAT</text><text class="c" x="533" y="196">Security Group</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">WEB-PROD</text><text class="t" x="773" y="147">target :443</text><text class="c" x="773" y="174">job completed</text><text class="c" x="773" y="196">vpc status 수렴</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">범용 port forwarding 대신 허용 source와 단일 attachment의 target port를 명시적으로 연결합니다.</text>
</svg>
