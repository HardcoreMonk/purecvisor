<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="dpdk-title dpdk-desc">
  <title id="dpdk-title">DPDK 활용 예제 구성도</title>
  <desc id="dpdk-desc">전용 PCI NIC와 hugepage 준비 상태를 확인하고 PureCVisor가 장치를 vfio-pci에 바인딩해 OVS-DPDK bridge를 구성한 뒤 VM vhost-user 가속 경로를 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a5b13"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#fff4e8;stroke:#b87543;stroke-width:1.5}.verify{fill:#fff0df;stroke:#b87543;stroke-width:1.5}.edge{fill:none;stroke:#9a5b13;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#9a5b13}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.8 · DPDK FAST PATH</text><text class="t" x="35" y="59">전용 PCI NIC로 OVS-DPDK bridge 구성</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">PRECHECK</text><text class="t" x="53" y="147">전용 PCI NIC</text><text class="c" x="53" y="174">IOMMU · hugepage</text><text class="c" x="53" y="196">관리 route 제외</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">PURECVISOR</text><text class="t" x="293" y="147">bind · bridge</text><text class="c" x="293" y="174">vfio-pci 전환</text><text class="c" x="293" y="196">desired state</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">FAST PATH</text><text class="t" x="533" y="147">OVS-DPDK</text><text class="c" x="533" y="174">poll mode driver</text><text class="c" x="533" y="196">vhost-user</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">VERIFY</text><text class="t" x="773" y="147">driver · OVS</text><text class="c" x="773" y="174">dpdk list</text><text class="c" x="773" y="196">복구 경로 확인</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">host kernel 경로를 우회하므로 out-of-band 복구 수단과 원래 kernel driver 정보를 먼저 확보합니다.</text>
</svg>
