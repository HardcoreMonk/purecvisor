<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="sriov-title sriov-desc">
  <title id="sriov-title">SR-IOV 활용 예제 구성도</title>
  <desc id="sriov-desc">전용 물리 NIC에서 VF를 활성화하고 VLAN 100과 spoof check를 적용한 뒤 PureCVisor가 IOMMU hostdev로 web-prod VM에 직접 할당하고 실제 VF 상태를 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a5b13"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#fff4e8;stroke:#b87543;stroke-width:1.5}.verify{fill:#fff0df;stroke:#b87543;stroke-width:1.5}.edge{fill:none;stroke:#9a5b13;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#9a5b13}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.9 · SR-IOV FAST PATH</text><text class="t" x="35" y="59">VLAN 100 VF를 웹 VM에 직접 할당</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">PHYSICAL NIC</text><text class="t" x="53" y="147">PF eno2</text><text class="c" x="53" y="174">VF 0 · VLAN 100</text><text class="c" x="53" y="196">spoof check on</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">PURECVISOR</text><text class="t" x="293" y="147">VF 검증 · attach</text><text class="c" x="293" y="174">PF/VF IOMMU group</text><text class="c" x="293" y="196">정지 VM 확인</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">DIRECT PATH</text><text class="t" x="533" y="147">hostdev · IOMMU</text><text class="c" x="533" y="174">Linux bridge 우회</text><text class="c" x="533" y="196">TC QoS 우회</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">WEB-PROD</text><text class="t" x="773" y="147">guest VF</text><text class="c" x="773" y="174">dumpxml · sriov list</text><text class="c" x="773" y="196">VLAN 통신</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">직접 할당 경로는 일반 bridge 정책을 우회하므로 switch VLAN과 guest driver까지 함께 검증합니다.</text>
</svg>
