<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="qos-title qos-desc">
  <title id="qos-title">QoS 활용 예제 구성도</title>
  <desc id="qos-desc">VM 또는 tenant의 대역폭 요구가 PureCVisor QoS handler를 거쳐 Linux TC qdisc와 filter에 적용되고 실제 전송률과 drop 통계를 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.4 · QUALITY OF SERVICE</text><text class="t" x="35" y="59">VM·tenant SLA를 Linux TC에 적용</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">SLA</text><text class="t" x="53" y="147">min · max Mbps</text><text class="c" x="53" y="174">VM vnet 또는 tenant</text><text class="c" x="53" y="196">우선순위 결정</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">QOS HANDLER</text><text class="t" x="293" y="147">정책 계산</text><text class="c" x="293" y="174">desired state 저장</text><text class="c" x="293" y="196">interface 확인</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">HOST SHAPER</text><text class="t" x="533" y="147">TC qdisc · filter</text><text class="c" x="533" y="174">vnet ingress · egress</text><text class="c" x="533" y="196">class별 제한</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">VERIFY</text><text class="t" x="773" y="147">tc -s</text><text class="c" x="773" y="174">rate · backlog</text><text class="c" x="773" y="196">drop 증가 여부</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">설정 응답 뒤 실제 vnet의 qdisc와 전송률을 함께 확인해야 QoS 적용을 완료로 판단할 수 있습니다.</text>
</svg>
