<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="metrics-title metrics-desc">
  <title id="metrics-title">네트워크 Prometheus 메트릭 활용 예제 구성도</title>
  <desc id="metrics-desc">Linux NIC와 conntrack 통계가 PureCVisor 내장 collector를 거쳐 API metrics endpoint에 노출되고 Prometheus의 증가율과 임계값으로 drop 및 포화 징후를 판정하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.11 · PROMETHEUS METRICS</text><text class="t" x="35" y="59">NIC drop과 conntrack 포화 징후 확인</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">KERNEL STATS</text><text class="t" x="53" y="147">NIC · socket</text><text class="c" x="53" y="174">bytes · errors · drop</text><text class="c" x="53" y="196">conntrack entries</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">COLLECTOR</text><text class="t" x="293" y="147">purecvisorsd</text><text class="c" x="293" y="174">device label 정규화</text><text class="c" x="293" y="196">누적 counter</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">METRICS API</text><text class="t" x="533" y="147">/api/v1/metrics</text><text class="c" x="533" y="174">Prometheus scrape</text><text class="c" x="533" y="196">시계열 저장</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">SIGNAL</text><text class="t" x="773" y="147">rate · ratio</text><text class="c" x="773" y="174">drop 증가</text><text class="c" x="773" y="196">conntrack 포화</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">누적값 한 번이 아니라 시간 구간의 증가율과 entries 대비 limit 비율로 판단합니다.</text>
</svg>
