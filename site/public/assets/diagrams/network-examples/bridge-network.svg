<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="bridge-title bridge-desc">
  <title id="bridge-title">브릿지 네트워크 활용 예제 구성도</title>
  <desc id="bridge-desc">연결 목적과 주소 대역을 선택하고 PureCVisor가 Linux bridge와 dnsmasq 또는 물리 uplink를 구성한 뒤 VM NIC 연결과 실제 통신을 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.1 · BRIDGE NETWORK</text><text class="t" x="35" y="59">연결 목적에 맞는 기본 네트워크 생성</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">INPUT</text><text class="t" x="53" y="147">mode · CIDR · uplink</text><text class="c" x="53" y="174">nat / isolated / routed</text><text class="c" x="53" y="196">dedicated / shared</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">PURECVISOR</text><text class="t" x="293" y="147">desired state 적용</text><text class="c" x="293" y="174">충돌 · 관리 경로 확인</text><text class="c" x="293" y="196">persistent metadata</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">HOST PATH</text><text class="t" x="533" y="147">bridge · dnsmasq</text><text class="c" x="533" y="174">nftables 또는 uplink</text><text class="c" x="533" y="196">libvirt VM NIC</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">VERIFY</text><text class="t" x="773" y="147">actual state</text><text class="c" x="773" y="174">network list · ip</text><text class="c" x="773" y="196">guest 통신 확인</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">선택한 mode에 따라 내부 격리, NAT·routed 외부 통신 또는 물리 LAN 연결로 수렴합니다.</text>
</svg>
