<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="sg-title sg-desc">
  <title id="sg-title">보안 그룹 활용 예제 구성도</title>
  <desc id="sg-desc">웹 포트와 관리 CIDR의 SSH 허용 규칙이 PureCVisor 보안 그룹 desired state를 거쳐 nftables에 적용되고 web-prod VM NIC에서 default-deny와 허용 통신을 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.7 · SECURITY GROUP</text><text class="t" x="35" y="59">웹 포트와 관리 CIDR의 SSH만 허용</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">RULES</text><text class="t" x="53" y="147">TCP 80 · 443</text><text class="c" x="53" y="174">SSH 관리 CIDR</text><text class="c" x="53" y="196">나머지 default-deny</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">SG DESIRED</text><text class="t" x="293" y="147">web-sg → VM</text><text class="c" x="293" y="174">tenant · 입력 검증</text><text class="c" x="293" y="196">SQLite 영속화</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">HOST FILTER</text><text class="t" x="533" y="147">nftables</text><text class="c" x="533" y="174">VM NIC 경계</text><text class="c" x="533" y="196">source · port match</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">WEB-PROD</text><text class="t" x="773" y="147">allow · deny</text><text class="c" x="773" y="174">HTTP · HTTPS</text><text class="c" x="773" y="196">관리망 SSH만 허용</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">그룹 연결 뒤 nftables actual state와 허용·차단 양쪽 테스트를 모두 확인합니다.</text>
</svg>
