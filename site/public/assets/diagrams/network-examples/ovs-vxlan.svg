<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="vxlan-title vxlan-desc">
  <title id="vxlan-title">OVS VXLAN 활용 예제 구성도</title>
  <desc id="vxlan-desc">로컬 tunnel source와 원격 endpoint 및 VNI 100을 지정하고 PureCVisor가 OVS bridge와 VXLAN port를 구성한 뒤 UDP 4789 underlay와 원격 통신을 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.5 · OVS VXLAN</text><text class="t" x="35" y="59">외부 VXLAN endpoint와 수동 peer 구성</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">TUNNEL INPUT</text><text class="t" x="53" y="147">local · remote IP</text><text class="c" x="53" y="174">VNI 100 · MTU</text><text class="c" x="53" y="196">underlay route</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">PURECVISOR</text><text class="t" x="293" y="147">peer desired state</text><text class="c" x="293" y="174">endpoint 검증</text><text class="c" x="293" y="196">OVS port 적용</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">OVERLAY PATH</text><text class="t" x="533" y="147">OVS · VXLAN</text><text class="c" x="533" y="174">VNI 100</text><text class="c" x="533" y="196">UDP 4789 underlay</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">REMOTE</text><text class="t" x="773" y="147">peer endpoint</text><text class="c" x="773" y="174">ovs-vsctl</text><text class="c" x="773" y="196">MTU · reachability</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">수동 peer는 중앙 cluster 제어면이 아니며, 명시한 두 endpoint의 underlay 도달성을 운영자가 보장합니다.</text>
</svg>
