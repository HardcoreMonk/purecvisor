<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="debug-title debug-desc">
  <title id="debug-title">네트워크 디버깅 활용 예제 구성도</title>
  <desc id="debug-desc">PureCVisor desired state에서 host link와 route, bridge 또는 OVS, nftables 정책, libvirt VM NIC까지 순서대로 actual state를 좁혀 장애 지점을 식별하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.10 · NETWORK DEBUGGING</text><text class="t" x="35" y="59">link에서 VM NIC까지 계층별 장애 격리</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">1 · DESIRED</text><text class="t" x="53" y="147">network list</text><text class="c" x="53" y="174">기대 bridge · mode</text><text class="c" x="53" y="196">VLAN · VXLAN 여부</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">2 · HOST</text><text class="t" x="293" y="147">link · route</text><text class="c" x="293" y="174">bridge · OVS</text><text class="c" x="293" y="196">underlay endpoint</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">3 · POLICY</text><text class="t" x="533" y="147">nftables · SG</text><text class="c" x="533" y="174">NAT · 격리 규칙</text><text class="c" x="533" y="196">허용 source · port</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">4 · VM NIC</text><text class="t" x="773" y="147">libvirt XML</text><text class="c" x="773" y="174">domiflist · link</text><text class="c" x="773" y="196">장애 경계 확정</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">한 번에 구성을 바꾸지 않고 기대 상태와 실제 상태가 처음 달라지는 경계를 찾습니다.</text>
</svg>
