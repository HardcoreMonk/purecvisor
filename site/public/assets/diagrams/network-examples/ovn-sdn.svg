<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="ovn-title ovn-desc">
  <title id="ovn-title">OVN SDN 활용 예제 구성도</title>
  <desc id="ovn-desc">웹 논리 네트워크 요청이 PureCVisor의 generic OVN 제어 경계를 거쳐 logical switch, router, DHCP, ACL과 SNAT에 적용되고 OVS br-int의 actual state를 검증하는 흐름이다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#12627a"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#7f8b99;stroke-width:1.5}.control{fill:#e6f7ed;stroke:#27845d;stroke-width:1.5}.actual{fill:#f0f2f5;stroke:#667085;stroke-width:1.5}.verify{fill:#e5f7f6;stroke:#287f7a;stroke-width:1.5}.edge{fill:none;stroke:#12627a;stroke-width:2.5;marker-end:url(#arrow)}.k{font:700 12px ui-monospace,monospace;letter-spacing:1px;fill:#12627a}.t{font:700 16px system-ui,sans-serif;fill:#171c24}.c{font:500 13px system-ui,sans-serif;fill:#5c6675}</style></defs>
  <rect class="bg" width="960" height="280"/><text class="k" x="35" y="31">6.6 · OVN SDN</text><text class="t" x="35" y="59">웹 논리 네트워크에 DHCP·ACL·SNAT 적용</text>
  <rect class="card" x="35" y="88" width="190" height="130" rx="8"/><text class="k" x="53" y="116">LOGICAL MODEL</text><text class="t" x="53" y="147">ls-web · lr-main</text><text class="c" x="53" y="174">subnet · DHCP</text><text class="c" x="53" y="196">ACL · SNAT</text>
  <rect class="control" x="275" y="88" width="190" height="130" rx="8"/><text class="k" x="293" y="116">GENERIC OVN</text><text class="t" x="293" y="147">RPC · REST</text><text class="c" x="293" y="174">ownership 검증</text><text class="c" x="293" y="196">객체별 적용</text>
  <rect class="actual" x="515" y="88" width="190" height="130" rx="8"/><text class="k" x="533" y="116">OVN · OVS</text><text class="t" x="533" y="147">LS · LR · LSP</text><text class="c" x="533" y="174">DHCP · ACL · NAT</text><text class="c" x="533" y="196">br-int data path</text>
  <rect class="verify" x="755" y="88" width="170" height="130" rx="8"/><text class="k" x="773" y="116">VERIFY</text><text class="t" x="773" y="147">NB · OVS actual</text><text class="c" x="773" y="174">상태 API 비교</text><text class="c" x="773" y="196">DHCP · egress</text>
  <path class="edge" d="M225 153H275"/><path class="edge" d="M465 153H515"/><path class="edge" d="M705 153H755"/><text class="c" x="35" y="253">generic OVN 경로는 Local VPC의 공개 linux backend와 별개이며, 명시된 추가 검증을 전제로 사용합니다.</text>
</svg>
