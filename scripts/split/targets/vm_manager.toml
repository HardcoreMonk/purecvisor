name = "vm_manager"
source = "src/modules/virt/vm_manager.c"
manifest = "scripts/split/vm_family_manifest.tsv"
rename_map = "scripts/split/vm_family_rename_map.tsv"
family_globs = [
    "src/modules/virt/vm_manager.c",
    "src/modules/virt/vm_manager.h",
    "src/modules/virt/vm_manager_internal.h",
    "src/modules/virt/vm_metadata.c",
    "src/modules/virt/vm_xml_build.c",
    "src/modules/virt/vm_create.c",
    "src/modules/virt/vm_ops.c",
]
makefile_anchor = "    src/modules/virt/vm_manager.c \\"
internal_header = "src/modules/virt/vm_manager_internal.h"
c_prologue = '''/**
 * @file {base}
 * @brief {brief}
 *
 * Developer note — 신입 개발자:
 *   (VM 계열 분할, ADR-0096)으로 {source}에서 옮긴 코드다. 본문은 옮기기 전과 같고
 *   (scripts/split_move_identity.py --config vm_manager), 파일끼리 함께 쓰는 선언은 src/modules/virt/vm_manager_internal.h에 있다.
 *   실패 시 영향: 옮긴 함수의 계약(인자·소유권·잠금·응답)을 바꾸면 호출부와 어긋나 해당 VM 경로의 응답·정리 동작이 달라진다.
 *
 * [쉬운 설명] {easy}
 */

{includes}
'''
group_comment = "vm_manager 계열 파일끼리 쓰는 함수"
split_files = ["src/modules/virt/vm_metadata.c", "src/modules/virt/vm_xml_build.c", "src/modules/virt/vm_create.c", "src/modules/virt/vm_ops.c"]

[identity]
routes = false
async = false
policy = "none"

[extra]
min_functions = 70                                                                                                                                                                                          
